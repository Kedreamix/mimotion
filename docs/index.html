<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#07090d" />
  <title>mimotion</title>
  <meta name="description" content="Zepp Life / 小米运动自动刷步状态" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2307090d'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23ff5a1f' stroke-width='6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>mimotion</h1>
        <p>自动刷步</p>
      </div>
    </div>
    <nav class="nav" aria-label="页面">
      <a href="./" class="active">看板</a>
      <a href="./settings.html">参数</a>
    </nav>
    <div class="top-meta">
      <time id="clock">--:--</time>
      <button id="refresh" type="button">刷新</button>
    </div>
  </header>

  <main>
    <section class="glance" id="status-card">
      <div class="steps">
        <p class="kicker">最近步数</p>
        <strong id="last-step">—</strong>
        <div class="bar" aria-hidden="true"><i id="bar-value"></i></div>
        <span class="muted" id="step-date">等待数据</span>
      </div>
      <dl class="facts">
        <div>
          <dt>状态</dt>
          <dd id="status-text">加载中</dd>
          <dd class="muted" id="status-detail"></dd>
        </div>
        <div>
          <dt>下次定时</dt>
          <dd id="next-run">—</dd>
          <dd class="muted" id="next-run-rel"></dd>
        </div>
        <div>
          <dt>上次</dt>
          <dd id="last-sync">—</dd>
          <dd class="muted" id="last-sync-rel"></dd>
        </div>
      </dl>
    </section>

    <section class="panel slim">
      <div class="panel-head">
        <h2>计划整点</h2>
        <p class="muted" id="cron-caption">只标整点。具体分钟每次跑完后会重新随机。</p>
      </div>
      <ol class="hour-row" id="timeline"></ol>
    </section>

    <section class="panel slim">
      <div class="quick-row">
        <button id="run-now" class="primary" type="button">马上刷步</button>
        <a href="./settings.html">改参数</a>
      </div>
      <p id="ops-status" class="banner" hidden></p>
      <details class="more">
        <summary>本次范围与 PAT</summary>
        <div class="ops-grid">
          <label class="field">最小步数
            <input id="op-min" type="number" min="1" step="1" placeholder="沿用仓库" />
          </label>
          <label class="field">最大步数
            <input id="op-max" type="number" min="1" step="1" placeholder="沿用仓库" />
          </label>
        </div>
        <label class="field">PAT（只存在本机）
          <input id="pat" type="password" autocomplete="off" placeholder="github_pat_ 或 ghp_" />
        </label>
      </details>
    </section>

    <section class="panel slim">
      <div class="panel-head">
        <h2>最近刷步</h2>
        <a id="actions-link" href="#" target="_blank" rel="noreferrer">Actions</a>
      </div>
      <ul class="runs" id="runs"></ul>
    </section>
  </main>

  <footer>
    <p>公开页不含账号密码。
      <a id="repo-link" href="#" target="_blank" rel="noreferrer">仓库</a>
      ·
      <a id="workflow-link" href="#" target="_blank" rel="noreferrer">刷步工作流</a>
    </p>
  </footer>
  <script src="./schedule.js"></script>
  <script src="./api.js"></script>
  <script src="./app.js"></script>
</body>
</html>
