<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#07090d" />
  <title>mimotion 参数</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2307090d'/%3E%3Ccircle cx='32' cy='32' r='22' fill='none' stroke='%23ff5a1f' stroke-width='6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg"></div>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>参数</h1>
        <p>Variables 与 Secret 分开</p>
      </div>
    </div>
    <nav class="nav">
      <a href="./">看板</a>
      <a href="./settings.html" class="active">参数</a>
    </nav>
  </header>

  <main>
    <p id="status" class="banner" hidden></p>

    <section class="panel slim">
      <label class="field">PAT（只存在本机）
        <input id="pat" type="password" autocomplete="off" placeholder="github_pat_ 或 ghp_" />
      </label>
      <div class="actions">
        <button id="save-pat" type="button">保存</button>
        <button id="clear-pat" type="button">清除</button>
        <button id="load-vars" type="button">读取当前变量</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>常用参数</h2>
        <span class="muted">空着不改，只写入你改过的项</span>
      </div>
      <form id="tunable-form" class="form-grid"></form>
      <div class="actions">
        <button id="save-vars" class="primary" type="button">保存变量</button>
        <button id="save-and-run" type="button">保存并刷步</button>
        <button id="run-now" type="button">马上刷步</button>
        <button id="copy-vars" type="button">复制清单</button>
      </div>
    </section>

    <details class="panel more-panel">
      <summary>账号 CONFIG（Secret，不自动提交）</summary>
      <form id="secret-form" class="form-grid"></form>
      <div class="actions">
        <button id="copy-config" class="primary" type="button">复制 CONFIG JSON</button>
        <a id="secrets-link" href="#" target="_blank" rel="noreferrer">打开 Secrets</a>
      </div>
      <pre id="config-preview" class="json"></pre>
    </details>

    <details class="panel more-panel">
      <summary>其它工作流</summary>
      <div class="actions">
        <button id="apply-cron" type="button">应用新定时</button>
        <button id="refresh-pages" type="button">刷新看板</button>
        <a id="vars-link" href="#" target="_blank" rel="noreferrer">Variables</a>
        <a id="update-workflow-link" href="#" target="_blank" rel="noreferrer">用 Actions 更新</a>
        <a id="run-workflow-link" href="#" target="_blank" rel="noreferrer">去 Actions 刷步</a>
      </div>
    </details>
  </main>
  <script src="./api.js"></script>
  <script src="./settings.js"></script>
</body>
</html>
