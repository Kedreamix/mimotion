name: 刷步数

on:
  schedule:
    - cron: '52 1,4,7,10,12,14 * * *'
  workflow_dispatch:
    inputs:
      min_step:
        description: 本次最小步数（留空则用仓库变量 / CONFIG）
        required: false
      max_step:
        description: 本次最大步数（留空则用仓库变量 / CONFIG）
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
            REPO_VARS: ${{ toJSON(vars) }}
            MIN_STEP: ${{ github.event.inputs.min_step || vars.MIN_STEP }}
            MAX_STEP: ${{ github.event.inputs.max_step || vars.MAX_STEP }}
            SLEEP_GAP: ${{ vars.SLEEP_GAP }}
            USE_CONCURRENT: ${{ vars.USE_CONCURRENT }}
            PUSH_PLUS_HOUR: ${{ vars.PUSH_PLUS_HOUR }}
            PUSH_PLUS_MAX: ${{ vars.PUSH_PLUS_MAX }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          git commit -m "persist tokens trigger by ${{ github.event_name }}"
          git push origin master
