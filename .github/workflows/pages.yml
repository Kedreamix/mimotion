name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "cron_change_time"
      - ".github/workflows/pages.yml"
      - ".github/scripts/build_pages_data.py"
      - "util/params.py"
  workflow_dispatch:
  schedule:
    - cron: "20 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build dashboard snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_VARS: ${{ toJSON(vars) }}
          MIN_STEP: ${{ vars.MIN_STEP }}
          MAX_STEP: ${{ vars.MAX_STEP }}
          CRON_HOURS: ${{ vars.CRON_HOURS }}
          SLEEP_GAP: ${{ vars.SLEEP_GAP }}
          USE_CONCURRENT: ${{ vars.USE_CONCURRENT }}
          PUSH_PLUS_HOUR: ${{ vars.PUSH_PLUS_HOUR }}
          PUSH_PLUS_MAX: ${{ vars.PUSH_PLUS_MAX }}
        run: python3 .github/scripts/build_pages_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
