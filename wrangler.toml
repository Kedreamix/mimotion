# Cloudflare Workers Builds 在仓库根目录执行 `npx wrangler deploy`。
# 控制台里的 Worker 名叫 mimotion，必须和 name 一致。
name = "mimotion"
main = "worker/src/index.js"
compatibility_date = "2024-09-23"

[vars]
ALLOWED_ORIGINS = "https://kedreamix.github.io/mimotion,http://127.0.0.1:8765,http://localhost:8765,http://127.0.0.1:8787"
OAUTH_REDIRECT_URI = "https://kedreamix.github.io/mimotion/"
