# Cloudflare Workers Builds 在仓库根目录执行 `npx wrangler deploy`。
# 控制台里的 Worker 名叫 mimotion，必须和 name 一致。
# keep_vars：部署时不要清掉控制台里单独加的变量。OWNER_PASSWORD / CONFIG 应做成 Secret，不要做成明文 Variable。不要把 PAT 做成 Worker Secret。
name = "mimotion"
main = "worker/src/index.js"
compatibility_date = "2024-09-23"
keep_vars = true

[observability]
enabled = true

  [observability.logs]
  invocation_logs = true
  head_sampling_rate = 1

# Analytics Engine：dataset 在绑定里填名字即可，第一次写入时创建。
# 控制台 Bindings → Analytics Engine，Variable name = USAGE，dataset = mimotion_usage
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "mimotion_usage"

# D1：先在控制台建库 mimotion，绑到 Worker 变量 DB。
# git 部署要写上 database_id，否则可能冲掉控制台绑定。把 UUID 填到下面再取消注释。
# [[d1_databases]]
# binding = "DB"
# database_name = "mimotion"
# database_id = "你的-d1-database-id"

[vars]
ALLOWED_ORIGINS = "https://kedreamix.github.io/mimotion,http://127.0.0.1:8765,http://localhost:8765,http://127.0.0.1:8787"
OAUTH_REDIRECT_URI = "https://kedreamix.github.io/mimotion/"
